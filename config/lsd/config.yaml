# lsd (LSDeluxe) configuration
# Docs: https://github.com/lsd-rs/lsd#config-file

# == Classic ==
# Shorthand to override options for backwards compatibility with `ls`.
classic: false

# == Blocks ==
# Columns and their order in long/tree layout.
blocks:
  - permission
  - user
  - group
  - size
  - date
  - name

# == Color ==
color:
  when: auto

# == Date ==
# Possible values: date, relative, +<date_format>
date: date

# == Dereference ==
# Whether to dereference symbolic links.
dereference: false

# == Icons ==
icons:
  when: auto
  theme: fancy       # Requires Nerd Font (FiraMono NF installed)
  separator: ' '

# == Indicators ==
# Add indicator characters to certain listed files.
indicators: false

# == Layout ==
# Possible values: grid, tree, oneline
layout: grid

# == Recursion ==
recursion:
  enabled: false

# == Size ==
# Possible values: default, short, bytes
size: default

# == Sorting ==
sorting:
  column: name
  reverse: false
  dir-grouping: first   # Directories grouped at top

# == No Symlink ==
no-symlink: false

# == Total size ==
total-size: false

# == Symlink arrow ==
symlink-arrow: ⇒